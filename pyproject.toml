[project]
name = "himmens-resume"
version = "1.0.0"
description = "Resume generator for multiple formats and languages"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Joshua Himmens", email = "joshua@himmens.com"},
]
dependencies = [
    "pymupdf",
    "requests",
    "pytest",
]

[project.scripts]
build-resume = "build:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:.*importlib.*:488",
    "ignore::DeprecationWarning:sys:0"
]
markers = [
    "offline: marks tests to run in offline mode (no network connections)"
]
addopts = "--strict-markers"
