[package]
name = "resume-cli"
version = "1.0.0"
edition = "2021"
authors = ["Joshua Himmens <joshua@himmens.com>"]
description = "Build, validate, and publish resumes from structured YAML content using Typst"
license = "MIT"
readme = "README.md"

[[bin]]
name = "resume"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Typst integration
typst = "0.14"
typst-pdf = "0.14"

# PDF reading for link validation
lopdf = "0.38"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for link validation
reqwest = { version = "0.12", features = ["blocking"] }

# Utilities
regex = "1"
chrono = "0.4"
anyhow = "1"
colored = "3"
glob = "0.3"
tempfile = "3"

# Git operations
git2 = "0.20"

# Font loading
fontdb = "0.23"

[profile.release]
lto = true
codegen-units = 1
strip = true
