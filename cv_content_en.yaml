projects:
  - name: "Linique: Bimanual Robot Learning for Napkin Folding"
    organization: "UBC Engineering Physics capstone, six-person team; one of three Faculty Awards, Design & Innovation Day 2026"
    dates: "Sep 2025 – Apr 2026"
    url: "https://himmens.com/post/2026-07-11-linique-napkin-folding-robot/"
    visible: true
    highlights:
      - "Owned the software and robot-learning stack for a bimanual SO-101 system: synchronized teleoperation data collection, policy training, and on-device inference; roughly 40% autonomous folding success in physical trials."
      - "Chose real demonstrations over simulation, since deformable-cloth FEM is intractable for this task, and trained ACT, SmolVLA, and X-VLA policies on a #link(\"https://doi.org/10.57967/hf/8174\")[published 499-episode dataset]."
      - "Added a stage-and-progress reward model to reweight demonstrations for sample efficiency; diagnosed missed 30 Hz control deadlines and contributed SO-101 calibration test cases to LeRobot."

  - name: "FizzVolt: Reinforcement Learning for Circuit Design"
    organization: "HUD RL Environments Hackathon at Y Combinator, two-person team"
    dates: "Jun 2026"
    url: "https://himmens.com/post/2026-10-05-fizzvolt-circuit-design-rewards/"
    visible: true
    highlights:
      - "Built a GRPO training environment in which Qwen3-8B writes programs that construct circuit graphs, graded by deterministic electrical-rule, KiCad ERC, cost, size, and component-availability validators."

  - name: "HTTP 418: Autonomous Driving in Simulation"
    organization: "UBC ENPH 353, two-person team"
    dates: "Dec 2025"
    url: "https://himmens.com/post/2025-12-06-enph353-autonomous-robot/"
    visible: true
    highlights:
      - "Built a ROS control system in Gazebo combining imitation-learned steering (ONNX), HSV sign detection, and cloud-hosted YOLO OCR with histogram voting, after benchmarking PPO, SAC, and DQN against imitation learning."

