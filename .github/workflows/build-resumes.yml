name: Build Resumes

# Note on actions versions:
# - checkout: v4 (latest as of April 2024)
# - setup-python: v5 (latest as of April 2024)
# - upload/download-artifact: v4 (latest as of April 2024)
# - softprops/action-gh-release: v2 (latest as of April 2024)

# Default permissions for all jobs
permissions:
  contents: write  # Needed for creating releases and pushing to branches
  packages: read   # Needed for downloading artifacts

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.yaml'
      - '**.typ'
      - '.github/workflows/build-resumes.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.yaml'
      - '**.typ'
      - '.github/workflows/build-resumes.yml'
  # Allow manual triggering via GitHub UI
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Add permissions needed for artifacts and releases
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation
      
      - name: Install Typst
        run: |
          # Download and extract typst
          echo "Downloading Typst..."
          curl -L -o typst.tar.xz https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz
          
          echo "Extracting archive..."
          tar -xvf typst.tar.xz
          
          # Check if typst binary exists in the expected location
          if [ ! -f "typst-x86_64-unknown-linux-musl/typst" ]; then
            echo "Typst binary not found in expected location!"
            echo "Contents of extracted archive:"
            find . -name "typst*" -type f
            exit 1
          fi
          
          # Install typst binary
          echo "Installing Typst..."
          chmod +x typst-x86_64-unknown-linux-musl/typst
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
          
          # Clean up downloaded files
          echo "Cleaning up..."
          rm -rf typst.tar.xz typst-x86_64-unknown-linux-musl
          
          # Verify installation
          echo "Verifying installation..."
          typst --version
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pymupdf requests
          
      - name: Build resumes
        run: |
          python3 build.py
          
      - name: Run link test (offline mode)
        run: |
          python3 -m pytest -v tests/ -W ignore::DeprecationWarning
        env:
          CI: "true"
          
      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resumes
          path: output/*.pdf
          
      # Only create release when pushed to main branch
      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Resume Update ${{ github.sha }}
          tag_name: v${{ github.run_number }}
          files: output/*.pdf
          generate_release_notes: true
          body: |
            Automated build of resume PDFs from the latest content.
            
            ### Files included
            - Academic resume (English)
            - Academic resume (French)
            - Business resume (English)
            - Business resume (French)
            
            Generated via GitHub Actions on ${{ github.event.repository.updated_at }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  # Add a job to commit PDFs to a "published" branch
  publish-pdfs:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    # Add write permissions to create and push to published branch
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Git configuration
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          
      - name: Create or checkout published branch
        run: |
          echo "Checking if published branch exists..."
          git fetch origin
          
          if git ls-remote --heads origin published | grep published; then
            echo "Published branch exists, checking it out"
            git checkout -B published --track origin/published
          else
            echo "Creating new published branch"
            git checkout -b published
            git commit --allow-empty -m "Initialize published branch"
            git push -u origin published
          fi
          
      - name: Download built PDFs
        uses: actions/download-artifact@v4
        with:
          name: resumes
          path: output/
          
      - name: Commit PDFs to published branch
        run: |
          mkdir -p output
          echo "Current directory content:"
          ls -la
          
          echo "Output directory content:"
          ls -la output/
          
          # Make sure the output directory exists and has PDFs
          if [ -z "$(ls -A output/)" ]; then
            echo "Warning: Output directory is empty! Checking artifacts..."
            find . -name "*.pdf" -type f
          fi
          
          # Add all PDFs to git
          git add -f output/*.pdf || echo "No PDFs found to add"
          
          # Try to commit, but don't fail if nothing to commit
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update PDFs from ${{ github.sha }}"
          
          # Push changes
          git push origin published