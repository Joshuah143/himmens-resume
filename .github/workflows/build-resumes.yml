name: Build Resumes and Check Links

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Typst
        uses: typst-community/setup-typst@v2
        with:
          version: latest
      
      - name: Build Academic Resume
        run: typst compile new_ac.pdf
      
      - name: Build Business Resume
        run: typst compile new_ac.pdf
      
      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v3
        with:
          name: resumes
          path: |
            new_ac.pdf

  check-links:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      
      - name: Download resume PDFs
        uses: actions/download-artifact@v3
        with:
          name: resumes
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdfminer.six requests
      
      - name: Check links in resumes
        run: python tests/check_links.py